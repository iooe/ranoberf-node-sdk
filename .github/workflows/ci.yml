name: Catalog count recovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  ranoberf-count:
    if: github.head_ref == 'catalog-crawl-2026-08-18'
    name: RanobeRF exact count
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build SDK
        run: npm ci && npm run build
      - name: Recover exact filtered count
        run: node scripts/export-ranoberf-count-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranoberf-count-recovery
          path: out/
          if-no-files-found: warn
          retention-days: 3

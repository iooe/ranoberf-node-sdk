name: Probe source APIs

on:
  push:
    branches:
      - agent/source-api-sdk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = "Mozilla/5.0 (compatible; source-contract-probe/1.1)"

          def fetch(url, accept="application/json,text/html;q=0.9,*/*;q=0.8"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": accept,
                  "Referer": urllib.parse.urljoin(url, "/"),
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(3_000_000)
                      return response.status, response.headers.get("content-type", ""), response.geturl(), body
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("content-type", ""), error.geturl(), error.read(300_000)
              except Exception as error:
                  return 0, type(error).__name__, url, str(error).encode()

          def scalar_shape(value):
              if isinstance(value, str):
                  return {"type": "str", "length": len(value), "sample": value[:120]}
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "sample": shape(value[0], 1) if value else None}
              if isinstance(value, dict):
                  return shape(value, 1)
              return value

          def shape(value, depth=0):
              if depth > 5:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {key: scalar_shape(child) if depth >= 4 else shape(child, depth + 1) for key, child in list(value.items())[:100]}
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "sample": shape(value[0], depth + 1) if value else None}
              return scalar_shape(value)

          def probe_json(label, url):
              status, content_type, final_url, body = fetch(url)
              print(f"\n### {label}\nstatus={status} content_type={content_type} final={final_url} bytes={len(body)}")
              try:
                  payload = json.loads(body.decode("utf-8-sig"))
              except Exception:
                  print(body[:600].decode("utf-8", "replace"))
                  return None
              print(json.dumps(shape(payload), ensure_ascii=False, indent=2)[:40000])
              return payload

          for base in [
              "https://www.xn--80ac9aeh6f.xn--p1ai",
              "https://xn--80ac9aeh6f.xn--p1ai",
          ]:
              book = probe_json(f"ranoberf book {base}", f"{base}/api/v2/books/povelitely")
              chapters = probe_json(f"ranoberf chapters {base}", f"{base}/api/v2/books/povelitely/chapters")
              if isinstance(chapters, dict):
                  items = chapters.get("items") or chapters.get("data") or []
              elif isinstance(chapters, list):
                  items = chapters
              else:
                  items = []
              if items:
                  free = next((item for item in items if isinstance(item, dict) and (item.get("hasUserPaid") or item.get("availabilityStatus") == "free")), items[0])
                  slug = free.get("slug") if isinstance(free, dict) else None
                  if slug:
                      probe_json(f"ranoberf chapter {base}", f"{base}/api/v2/books/povelitely/chapters/{urllib.parse.quote(str(slug))}")
              for path in ["/api/v2/books?page=1&limit=3", "/api/v2/catalog/books?page=1&limit=3"]:
                  probe_json(f"ranoberf catalog {base}{path}", base + path)

          def clean_snippet(value):
              value = re.sub(r'<script\b[^>]*>[\s\S]*?</script\s*>', '', value, flags=re.I)
              value = re.sub(r'\s+', ' ', value)
              return value[:2200]

          status, content_type, final_url, body = fetch("https://tl.rulate.ru/book/201009", "text/html,*/*;q=0.8")
          text = body.decode("utf-8", "replace")
          print(f"\n### rulate book\nstatus={status} content_type={content_type} final={final_url} bytes={len(body)}")
          for label, pattern in [
              ("info", r'<div[^>]+id=["\']Info["\'][^>]*>[\s\S]{0,25000}'),
              ("header", r'<[^>]+class=["\'][^"\']*book-header[^"\']*["\'][^>]*>[\s\S]{0,8000}'),
              ("description", r'<[^>]+class=["\'][^"\']*book-description[^"\']*["\'][^>]*>[\s\S]{0,5000}'),
              ("chapter-row", r'<tr[^>]+class=["\'][^"\']*chapter_row[^"\']*["\'][^>]*>[\s\S]*?</tr>'),
          ]:
              match = re.search(pattern, text, re.I)
              print(f"\n-- {label} --\n{clean_snippet(match.group(0)) if match else 'not found'}")
          print("\n-- chapter links --")
          for match in re.finditer(r'<a[^>]+href=["\']([^"\']*/book/201009/[^"\']+)["\'][^>]*>([\s\S]*?)</a>', text, re.I):
              href, label = match.groups()
              if "ready" in href:
                  print(href, re.sub(r'<[^>]+>', '', label).strip()[:200])
                  if match.start() > 0:
                      print(clean_snippet(text[max(0, match.start()-1000):match.end()+1000]))
                  break
          image_urls = []
          for match in re.finditer(r'<img\b[^>]*(?:src|data-src|data-lazy-src)=["\']([^"\']+)', text, re.I):
              image_urls.append(urllib.parse.urljoin(final_url, html.unescape(match.group(1))))
          print("\n-- images --\n" + json.dumps(list(dict.fromkeys(image_urls))[:30], ensure_ascii=False, indent=2))

          ajax_url = "https://tl.rulate.ru/book/201009/25027920/readyajax?is_new=true"
          probe_json("rulate chapter readyajax", ajax_url)

          status, content_type, final_url, body = fetch("https://tl.rulate.ru/search", "text/html,*/*;q=0.8")
          search_html = body.decode("utf-8", "replace")
          print(f"\n### rulate search\nstatus={status} bytes={len(body)}")
          form = re.search(r'<form[^>]+action=["\']/search["\'][^>]*>[\s\S]*?</form>', search_html, re.I)
          row = re.search(r'<[^>]+class=["\'][^"\']*row-book[^"\']*["\'][^>]*>[\s\S]{0,15000}', search_html, re.I)
          pager = re.search(r'<[^>]+class=["\'][^"\']*(?:books-pagination|pagination)[^"\']*["\'][^>]*>[\s\S]{0,5000}', search_html, re.I)
          print("\n-- search form --\n" + (clean_snippet(form.group(0)) if form else "not found"))
          print("\n-- search row --\n" + (clean_snippet(row.group(0)) if row else "not found"))
          print("\n-- search pager --\n" + (clean_snippet(pager.group(0)) if pager else "not found"))
          PY
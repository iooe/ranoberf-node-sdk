name: Probe source APIs

on:
  push:
    branches:
      - agent/source-api-sdk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify RanobeRF v3 view parameters
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://xn--80acm4afj.xn--p1ai"
          UA = "Mozilla/5.0 (compatible; ranoberf-sdk-contract-probe/4.0)"

          def fetch(path):
              url = BASE + path
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json", "Referer": BASE + "/"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.geturl(), r.read(5_000_000)
              except urllib.error.HTTPError as e:
                  return e.code, e.geturl(), e.read(1_000_000)

          def shape(v, depth=0):
              if depth > 5: return type(v).__name__
              if isinstance(v, dict): return {k: shape(x, depth+1) for k, x in list(v.items())[:120]}
              if isinstance(v, list): return {"type":"list","length":len(v),"sample":shape(v[0],depth+1) if v else None}
              if isinstance(v, str): return {"type":"str","length":len(v),"sample":v[:180]}
              return v

          candidates = [
              "/v3/books?page=1&pageSize=3&expand=lastChapter,verticalImage,horizontalImage,squareImage,userRating",
              "/v3/books?page=1&pageSize=3&expand=lastChapter%2CverticalImage%2ChorizontalImage%2CsquareImage%2CuserRating",
              "/v3/books/view?id=4270&expand=country,genres,chapters,verticalImage,horizontalImage,squareImage,lastChapter,userRating",
              "/v3/books/view?bookId=4270&expand=country,genres,chapters,verticalImage,horizontalImage,squareImage,lastChapter,userRating",
              "/v3/books/view?slug=bezdna-nebes&expand=country,genres,chapters,verticalImage,horizontalImage,squareImage,lastChapter,userRating",
              "/v3/chapters/view?id=2080509&expand=content,book,translator,user",
              "/v3/chapters/view?chapterId=2080509&expand=content,book,translator,user",
              "/v3/chapters/view?bookId=4270&slug=glava-1-vozvraschenie-iz-bezdny-nebes&expand=content,book,translator,user",
              "/v3/chapters?page=1&pageSize=3&bookId=4270",
              "/v3/chapters?page=1&pageSize=3&filter%5BbookId%5D=4270",
              "/v3/users/view?id=10954",
              "/v3/users/10954",
              "/v3/user/view?id=10954",
              "/v3/auth/index?id=10954",
          ]
          for path in candidates:
              status, final, body = fetch(path)
              print("\n###", path, "status=", status, "final=", final, "bytes=", len(body))
              try:
                  print(json.dumps(shape(json.loads(body.decode("utf-8-sig"))), ensure_ascii=False, indent=2)[:40000])
              except Exception:
                  print(body[:1200].decode("utf-8", "replace"))
          PY

name: Probe source APIs

on:
  push:
    branches:
      - agent/source-api-sdk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe RanobeRF public API contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = "Mozilla/5.0 (compatible; ranoberf-sdk-contract-probe/1.0)"

          def fetch(url, accept="application/json,text/html;q=0.9,*/*;q=0.8"):
              request = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": accept,
                  "Referer": urllib.parse.urljoin(url, "/"),
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.headers.get("content-type", ""), response.geturl(), response.read(4_000_000)
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("content-type", ""), error.geturl(), error.read(500_000)
              except Exception as error:
                  return 0, type(error).__name__, url, str(error).encode()

          def shape(value, depth=0):
              if depth > 5:
                  return type(value).__name__
              if isinstance(value, dict):
                  result = {}
                  for key, child in list(value.items())[:120]:
                      if isinstance(child, str):
                          result[key] = {"type": "str", "length": len(child), "sample": child[:160]}
                      else:
                          result[key] = shape(child, depth + 1)
                  return result
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "sample": shape(value[0], depth + 1) if value else None}
              return value

          def probe(label, url):
              status, content_type, final_url, body = fetch(url)
              print(f"\n### {label}\nstatus={status} content_type={content_type} final={final_url} bytes={len(body)}")
              try:
                  payload = json.loads(body.decode("utf-8-sig"))
              except Exception:
                  print(body[:1600].decode("utf-8", "replace"))
                  return None
              print(json.dumps(shape(payload), ensure_ascii=False, indent=2)[:50000])
              return payload

          base = "https://xn--80acm4afj.xn--p1ai"
          status, content_type, final_url, body = fetch(base, "text/html,*/*;q=0.8")
          page = body.decode("utf-8", "replace")
          print(f"\n### home\nstatus={status} content_type={content_type} final={final_url} bytes={len(body)}")
          print("scripts=", json.dumps(re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', page, re.I)[:100], ensure_ascii=False))
          print("book_links=", json.dumps(sorted(set(re.findall(r'href=[\"\']/([^\"\'/?#]+)/?[\"\']', page, re.I)))[:100], ensure_ascii=False))

          aliases = ["povelitely"]
          aliases.extend(sorted(set(re.findall(r'href=[\"\']/([^\"\'/?#]+)/?[\"\']', page, re.I))))
          aliases = [item for item in dict.fromkeys(aliases) if item not in {"api", "books", "catalog", "login", "register"}][:25]

          working_alias = None
          for alias in aliases:
              payload = probe(f"book {alias}", f"{base}/api/v2/books/{urllib.parse.quote(alias)}")
              if isinstance(payload, dict) and any(key in payload for key in ("title", "fullTitle", "alias", "images")):
                  working_alias = alias
                  break

          if working_alias:
              chapters = probe("chapters", f"{base}/api/v2/books/{urllib.parse.quote(working_alias)}/chapters")
              items = []
              if isinstance(chapters, dict):
                  items = chapters.get("items") or chapters.get("data") or chapters.get("chapters") or []
              elif isinstance(chapters, list):
                  items = chapters
              if items:
                  free = next((item for item in items if isinstance(item, dict) and (item.get("hasUserPaid") or item.get("availabilityStatus") == "free")), items[0])
                  slug = free.get("slug") if isinstance(free, dict) else None
                  if slug:
                      probe("chapter", f"{base}/api/v2/books/{urllib.parse.quote(working_alias)}/chapters/{urllib.parse.quote(str(slug))}")

          for path in [
              "/api/v2/books",
              "/api/v2/books?page=1",
              "/api/v2/books?page=1&limit=3",
              "/api/v2/catalog",
              "/api/v2/catalog/books?page=1&limit=3",
              "/api/v2/search?query=маг",
              "/api/v2/books/search?query=маг",
              "/openapi.json",
              "/api/openapi.json",
              "/swagger.json",
          ]:
              probe(f"candidate {path}", base + path)

          scripts = re.findall(r'<script[^>]+src=[\"\']([^\"\']+)', page, re.I)
          for source in scripts[:40]:
              url = urllib.parse.urljoin(final_url, source)
              status, content_type, resolved, body = fetch(url, "application/javascript,text/javascript,*/*;q=0.8")
              text = body.decode("utf-8", "replace")
              paths = sorted(set(re.findall(r'[\"\'](/api/v2/[^\"\'\\ ]+)', text)))
              if paths:
                  print(f"\n### frontend API routes {resolved}\nstatus={status} bytes={len(body)}")
                  print(json.dumps(paths[:300], ensure_ascii=False, indent=2))
          PY

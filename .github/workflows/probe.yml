name: Probe source APIs

on:
  push:
    branches:
      - agent/source-api-sdk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover current RanobeRF data routes
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = "https://xn--80acm4afj.xn--p1ai"
          UA = "Mozilla/5.0 (compatible; ranoberf-sdk-contract-probe/2.0)"

          def fetch(url, accept="*/*"):
              request = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": accept, "Referer": BASE + "/"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, response.headers.get("content-type", ""), response.geturl(), response.read(8_000_000)
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("content-type", ""), error.geturl(), error.read(1_000_000)
              except Exception as error:
                  return 0, type(error).__name__, url, str(error).encode()

          def shape(value, depth=0):
              if depth > 6: return type(value).__name__
              if isinstance(value, dict):
                  return {k: shape(v, depth + 1) for k, v in list(value.items())[:120]}
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "sample": shape(value[0], depth + 1) if value else None}
              if isinstance(value, str):
                  return {"type": "str", "length": len(value), "sample": value[:180]}
              return value

          def parse_next(text):
              match = re.search(r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>([\s\S]*?)</script>', text, re.I)
              if not match: return None
              return json.loads(html.unescape(match.group(1)))

          pages = ["/", "/bezdna-nebes"]
          collected_scripts = []
          for path in pages:
              status, content_type, final_url, body = fetch(BASE + path, "text/html,*/*;q=0.8")
              text = body.decode("utf-8", "replace")
              print(f"\n### PAGE {path} status={status} final={final_url} bytes={len(body)}")
              next_data = parse_next(text)
              print("NEXT_DATA=", json.dumps(shape(next_data), ensure_ascii=False, indent=2)[:50000])
              scripts = [urllib.parse.urljoin(final_url, s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I)]
              collected_scripts.extend(scripts)
              print("SCRIPTS=", json.dumps(scripts, ensure_ascii=False, indent=2))
              print("BOOK_CHAPTER_LINKS=", json.dumps(sorted(set(re.findall(r'href=["\']([^"\']+)', text, re.I)))[:300], ensure_ascii=False, indent=2))
              if isinstance(next_data, dict):
                  build_id = next_data.get("buildId")
                  page = next_data.get("page")
                  query = next_data.get("query") or {}
                  if build_id and page:
                      route = page
                      for key, value in query.items():
                          route = route.replace("[" + key + "]", str(value))
                      if route == "/": data_path = f"/_next/data/{build_id}/index.json"
                      else: data_path = f"/_next/data/{build_id}{route}.json"
                      status2, ct2, final2, body2 = fetch(BASE + data_path, "application/json,*/*;q=0.8")
                      print(f"NEXT_JSON {data_path} status={status2} ct={ct2} final={final2} bytes={len(body2)}")
                      try:
                          payload = json.loads(body2.decode("utf-8-sig"))
                          print(json.dumps(shape(payload), ensure_ascii=False, indent=2)[:50000])
                      except Exception:
                          print(body2[:1000].decode("utf-8", "replace"))

          for script_url in list(dict.fromkeys(collected_scripts)):
              if "xn--80acm4afj" not in script_url and script_url.startswith("http"): continue
              status, content_type, final_url, body = fetch(script_url, "application/javascript,text/javascript,*/*;q=0.8")
              text = body.decode("utf-8", "replace")
              absolute_urls = sorted(set(html.unescape(v) for v in re.findall(r'https?://[^"\'`\\\s)]+', text)))
              route_literals = sorted(set(re.findall(r'["\'](/(?:api|_next/data|books?|chapters?|catalog|search)[^"\'`\\\s]*)', text, re.I)))
              api_contexts = []
              for match in re.finditer(r'(?i)(?:baseURL|api|graphql|chapter|book)', text):
                  snippet = text[max(0, match.start()-180):min(len(text), match.end()+350)]
                  if snippet not in api_contexts: api_contexts.append(snippet)
                  if len(api_contexts) >= 30: break
              if absolute_urls or route_literals or api_contexts:
                  print(f"\n### SCRIPT {final_url} status={status} bytes={len(body)}")
                  print("ABSOLUTE_URLS=", json.dumps(absolute_urls[:300], ensure_ascii=False, indent=2))
                  print("ROUTES=", json.dumps(route_literals[:500], ensure_ascii=False, indent=2))
                  print("CONTEXTS=", json.dumps(api_contexts, ensure_ascii=False, indent=2)[:50000])
          PY

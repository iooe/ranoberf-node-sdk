name: Probe source APIs

on:
  push:
    branches:
      - agent/source-api-sdk

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = "Mozilla/5.0 (compatible; source-contract-probe/1.2)"

          def fetch(url, accept="application/json,text/html;q=0.9,*/*;q=0.8", extra=None):
              headers = {
                  "User-Agent": UA,
                  "Accept": accept,
                  "Referer": urllib.parse.urljoin(url, "/"),
              }
              headers.update(extra or {})
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(3_000_000)
                      return response.status, response.headers.get("content-type", ""), response.geturl(), body
              except urllib.error.HTTPError as error:
                  return error.code, error.headers.get("content-type", ""), error.geturl(), error.read(300_000)
              except Exception as error:
                  return 0, type(error).__name__, url, str(error).encode()

          def shape(value, depth=0):
              if depth > 5:
                  return type(value).__name__
              if isinstance(value, dict):
                  result = {}
                  for key, child in list(value.items())[:100]:
                      if isinstance(child, str):
                          result[key] = {"type": "str", "length": len(child), "sample": child[:120]}
                      else:
                          result[key] = shape(child, depth + 1)
                  return result
              if isinstance(value, list):
                  return {"type": "list", "length": len(value), "sample": shape(value[0], depth + 1) if value else None}
              return value

          def probe_json(label, url, extra=None):
              status, content_type, final_url, body = fetch(url, "application/json,text/javascript,*/*;q=0.8", extra)
              print(f"\n### {label}\nstatus={status} content_type={content_type} final={final_url} bytes={len(body)}")
              try:
                  payload = json.loads(body.decode("utf-8-sig"))
              except Exception:
                  print(body[:1200].decode("utf-8", "replace"))
                  return None
              print(json.dumps(shape(payload), ensure_ascii=False, indent=2)[:40000])
              return payload

          for base in ["https://www.xn--80ac9aeh6f.xn--p1ai", "https://xn--80ac9aeh6f.xn--p1ai"]:
              probe_json(f"ranoberf book {base}", f"{base}/api/v2/books/povelitely")
              probe_json(f"ranoberf chapters {base}", f"{base}/api/v2/books/povelitely/chapters")
              probe_json(f"ranoberf catalog {base}", f"{base}/api/v2/books?page=1&limit=3")

          def clean(value, limit=6000):
              value = re.sub(r'<script\b[^>]*>[\s\S]*?</script\s*>', '', value, flags=re.I)
              return re.sub(r'\s+', ' ', value)[:limit]

          book_url = "https://tl.rulate.ru/book/201009"
          status, content_type, final_url, body = fetch(book_url, "text/html,*/*;q=0.8")
          text = body.decode("utf-8", "replace")
          print(f"\n### rulate book status={status} bytes={len(body)}")
          for label, pattern in [
              ("info", r'<div[^>]+id=["\']Info["\'][^>]*>[\s\S]{0,35000}'),
              ("description", r'<[^>]+class=["\'][^"\']*book-description[^"\']*["\'][^>]*>[\s\S]{0,10000}'),
              ("chapter-row", r'<tr[^>]+class=["\'][^"\']*chapter_row[^"\']*["\'][^>]*>[\s\S]*?</tr>'),
          ]:
              match = re.search(pattern, text, re.I)
              print(f"\n-- {label} --\n{clean(match.group(0)) if match else 'not found'}")

          chapter_id = "25027713"
          ready_url = f"https://tl.rulate.ru/book/201009/{chapter_id}/ready_new"
          ajax_url = f"https://tl.rulate.ru/book/201009/{chapter_id}/readyajax?is_new=true"
          xhr_headers = {
              "X-Requested-With": "XMLHttpRequest",
              "Referer": ready_url,
          }
          probe_json("rulate chapter readyajax XHR", ajax_url, xhr_headers)
          probe_json("rulate chapter readyajax plain", ajax_url)

          status, content_type, final_url, body = fetch(ready_url, "text/html,*/*;q=0.8")
          chapter_html = body.decode("utf-8", "replace")
          print(f"\n### rulate ready page status={status} bytes={len(body)} final={final_url}")
          for label, pattern in [
              ("content", r'<div[^>]+class=["\'][^"\']*content-text[^"\']*["\'][^>]*>[\s\S]{0,12000}'),
              ("translator context", r'.{0,1000}(?:Переводчик|Перевод от|users/|team)[\s\S]{0,3000}'),
              ("chapter header", r'<h1[^>]*>[\s\S]*?</h1>'),
          ]:
              match = re.search(pattern, chapter_html, re.I)
              print(f"\n-- {label} --\n{clean(match.group(0)) if match else 'not found'}")

          members_url = "https://tl.rulate.ru/book/201009/members"
          status, content_type, final_url, body = fetch(members_url, "text/html,*/*;q=0.8")
          members_html = body.decode("utf-8", "replace")
          print(f"\n### rulate members status={status} bytes={len(body)}")
          match = re.search(r'<[^>]+class=["\'][^"\']*(?:members|table)[^"\']*["\'][^>]*>[\s\S]{0,15000}', members_html, re.I)
          print(clean(match.group(0)) if match else clean(members_html, 10000))

          status, content_type, final_url, body = fetch("https://tl.rulate.ru/search", "text/html,*/*;q=0.8")
          search_html = body.decode("utf-8", "replace")
          print(f"\n### rulate search status={status} bytes={len(body)}")
          for label, pattern in [
              ("advanced form", r'<form[^>]+action=["\']/search["\'][^>]*class=["\'][^"\']*(?:vertical|search)[^"\']*["\'][^>]*>[\s\S]*?</form>'),
              ("search row", r'<li><div class=["\']th["\']>[\s\S]{0,7000}'),
              ("pager", r'<div[^>]+class=["\'][^"\']*books-pagination[^"\']*["\'][^>]*>[\s\S]{0,2500}'),
          ]:
              match = re.search(pattern, search_html, re.I)
              print(f"\n-- {label} --\n{clean(match.group(0)) if match else 'not found'}")
          PY